spring:
  application:
    name: sast-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sast}
    username: ${SPRING_DATASOURCE_USERNAME:sast}
    password: ${SPRING_DATASOURCE_PASSWORD:change-me}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
  flyway:
    enabled: true
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:sast}
    password: ${SPRING_RABBITMQ_PASSWORD:change-me}
    connection-timeout: 5s
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
management:
  endpoints.web.base-path: /
  endpoint.health.show-details: never
sast:
  jwt:
    secret: ${SAST_JWT_SECRET:}
    issuer: ${SAST_JWT_ISSUER:sast-api}
    access-token-minutes: ${SAST_JWT_ACCESS_TOKEN_MINUTES:120}
  bootstrap:
    email: ${SAST_BOOTSTRAP_EMAIL:}
    password: ${SAST_BOOTSTRAP_PASSWORD:}
  github:
    token: ${SAST_GITHUB_TOKEN:}
    max-archive-bytes: ${SAST_GITHUB_MAX_ARCHIVE_BYTES:104857600}
    max-java-files: ${SAST_GITHUB_MAX_JAVA_FILES:1000}
    max-file-bytes: ${SAST_GITHUB_MAX_FILE_BYTES:2097152}
    max-extracted-bytes: ${SAST_GITHUB_MAX_EXTRACTED_BYTES:524288000}
  ollama:
    base-url: ${SAST_OLLAMA_BASE_URL:http://localhost:11434}
    model: ${SAST_OLLAMA_MODEL:llama3.2:3b}
    max-candidates: ${SAST_OLLAMA_MAX_CANDIDATES:0}
    total-budget-seconds: ${SAST_OLLAMA_TOTAL_BUDGET_SECONDS:0}
    suggestion-max-methods: ${SAST_OLLAMA_SUGGESTION_MAX_METHODS:4}
    suggestion-budget-seconds: ${SAST_OLLAMA_SUGGESTION_BUDGET_SECONDS:60}
  rabbit:
    publisher-delay-ms: ${SAST_RABBIT_PUBLISHER_DELAY_MS:1000}
    reconciler-delay-ms: ${SAST_RABBIT_RECONCILER_DELAY_MS:10000}
server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SAST_COOKIE_SECURE:false}
logging:
  structured:
    format:
      console: logstash
  level:
    root: INFO
    com.fiap.sast: INFO
